# Phase 0 CI: build the pinned engine on a fixed Ubuntu 24.04 image so every
# build (and later every AppImage) is produced the same way.
name: hopcast-engine

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets ci-report-failure.sh push logs to the dev-logs branch

jobs:
  engine-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch pinned engine (NAVER libobs fork)
        # obs-browser/obs-websocket must exist for CMake on Linux even when disabled
        run: |
          git submodule update --init --depth 1 src/obs-studio
          git -C src/obs-studio submodule update --init --depth 1 plugins/obs-browser plugins/obs-websocket

      - name: Install dependencies
        run: bash hopcast/scripts/deps-ubuntu.sh

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-engine-${{ github.sha }}
          restore-keys: ccache-engine-

      - name: Build engine
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          set -o pipefail
          bash hopcast/scripts/build-engine.sh build/engine build/engine-install 2>&1 | tee build-engine.log

      - name: Count engine warnings
        run: |
          n=$(grep -c "warning:" build-engine.log || true)
          f=$(grep -c "\[-Wformat" build-engine.log || true)
          echo "::notice title=engine warnings::$n compiler warnings ($f printf-format portability issues in NAVER code)"

      - name: Smoke test (libobs starts headless, plugins load)
        run: |
          set -o pipefail
          bash hopcast/scripts/smoke-test-engine.sh build/engine-install 2>&1 | tee smoke.log

      - name: Summarize smoke test
        if: success()
        run: |
          summary=$(grep -E "^(libobs .* started|video:|audio:|input types|  [a-z0-9_]+ +(ok|MISSING)|created source|PASS|FAIL)" smoke.log | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::notice title=smoke test::${summary}"
          grep -E "^(libobs .* started|video:|audio:|input types|  [a-z0-9_]+ +(ok|MISSING)|created source|PASS|FAIL)" smoke.log >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure details
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for f in build-engine.log smoke.log; do
            if [ -f "$f" ]; then bash hopcast/scripts/ci-report-failure.sh "$f" "${f%.log}"; fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: hopcast-engine-linux-x86_64
          path: build/engine-install
