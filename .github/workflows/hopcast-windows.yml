# HopCast for Windows: a portable .exe built from the same source as the Linux AppImage.
# Stage 1 (this file): build the engine on a Windows runner and publish the logs, so each failure
# can be fixed in turn. Manual only (workflow_dispatch). GPL-2.0-or-later.
name: hopcast-windows

on:
  workflow_dispatch:

permissions:
  contents: write   # pushes logs to the dev-logs-windows branch

jobs:
  engine-windows:
    runs-on: windows-2022
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch pinned engine (NAVER libobs fork)
        run: |
          git submodule update --init --depth 1 src/obs-studio
          git -C src/obs-studio submodule update --init --depth 1 plugins/obs-browser plugins/obs-websocket

      - name: Configure engine
        id: configure
        continue-on-error: true
        run: |
          W=$(echo "$GITHUB_WORKSPACE" | sed 's|\\|/|g')
          VERSION=$(tr -d '[:space:]' < hopcast/VERSION)
          IFS=. read -r a b c d <<< "$VERSION"
          export PLS_VERSION="$VERSION" VERSION="$VERSION" PRISM_VERSION_MAJOR="$a" PRISM_VERSION_MINOR="$b" PRISM_VERSION_PATCH="$c" PRISM_VERSION_TWEAK="${d:-0}"
          export PRISM_COMMENTS=HopCast PRISM_SRC_DIR="$W/src/prism-live-studio" OBS_SRC_DIR="$W/src/obs-studio" OBS_BUILD_DIR="$W/build/engine"
          cd src/obs-studio
          cmake --preset windows-x64 -Wno-dev -DCMAKE_PROJECT_INCLUDE="$W/hopcast/cmake/engine-compat.cmake" \
            -DENABLE_UI=OFF -DENABLE_BROWSER=OFF -DENABLE_WEBSOCKET=OFF -DENABLE_WEBRTC=OFF \
            -DENABLE_AJA=OFF -DENABLE_DECKLINK=OFF -DENABLE_VLC=OFF -DENABLE_SCRIPTING=OFF -DENABLE_VST=OFF \
            -DENABLE_SERVICE_UPDATES=OFF -DENABLE_VIRTUALCAM=OFF -DVIRTUALCAM_GUID=A49F51EE-8841-4425-BEC0-85D0C470BBDE -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF 2>&1 | tee "$W/configure.log"
          exit "${PIPESTATUS[0]}"

      - name: Build engine
        id: build
        if: steps.configure.outcome == 'success'
        continue-on-error: true
        run: |
          W=$(echo "$GITHUB_WORKSPACE" | sed 's|\\|/|g')
          export PLS_VERSION=$(tr -d '[:space:]' < hopcast/VERSION) PRISM_SRC_DIR="$W/src/prism-live-studio" OBS_SRC_DIR="$W/src/obs-studio"
          cmake --build "$W/build/engine" --config RelWithDebInfo --parallel 2>&1 | tee "$W/build.log"
          exit "${PIPESTATUS[0]}"

      - name: Install engine
        if: steps.build.outcome == 'success'
        run: |
          cmake --install build/engine --config RelWithDebInfo --prefix build/engine-install 2>&1 | tail -5

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtwebsockets qtmultimedia qtnetworkauth qtimageformats'
          cache: true

      - name: Install libraries (vcpkg)
        continue-on-error: true
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg.exe" install openssl zstd libpng fftw3 --triplet x64-windows 2>&1 | tee vcpkg.log
          exit "${PIPESTATUS[0]}"

      - name: Configure app
        id: appconfigure
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          W=$(echo "$GITHUB_WORKSPACE" | sed 's|\\|/|g')
          Q=$(echo "$QT_ROOT_DIR" | sed 's|\\|/|g')
          V=$(tr -d '[:space:]' < hopcast/VERSION)
          IFS=. read -r a b c d <<< "$V"
          export VERSION="$V" PLS_VERSION="$V" PRISM_VERSION_MAJOR="$a" PRISM_VERSION_MINOR="$b" PRISM_VERSION_PATCH="$c" PRISM_VERSION_TWEAK="${d:-0}" PRISM_COMMENTS=HopCast BUILD_TYPE=RelWithDebInfo
          export SRC_DIR="$W/src" OBS_SRC_DIR="$W/src/obs-studio" PRISM_SRC_DIR="$W/src/prism-live-studio" OBS_BUILD_DIR="$W/build/engine" PRISM_BUILD_DIR="$W/build/app" DEV_OUTPUT_DIR="$W/build/app/output" ARCH=x86_64 QTDIR="$Q"
          DEPS=$(ls -d "$W"/src/obs-studio/.deps/obs-deps-*-x64 | head -1)
          VC=$(echo "$VCPKG_INSTALLATION_ROOT" | sed 's|\\|/|g')/installed/x64-windows
          cmake -S src -B build/app -G "Visual Studio 17 2022" -A x64 -Wno-dev \
            -DCMAKE_PREFIX_PATH="$Q;$DEPS;$VC;$W/build/engine-install" -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF -DENABLE_TEST=OFF \
            -DCMAKE_PROJECT_INCLUDE="$W/hopcast/cmake/engine-compat.cmake" 2>&1 | tee "$W/appconfigure.log"
          exit "${PIPESTATUS[0]}"

      - name: Build app
        id: appbuild
        if: steps.appconfigure.outcome == 'success'
        continue-on-error: true
        run: |
          cmake --build build/app --config RelWithDebInfo --parallel 2>&1 | tee appbuild.log
          exit "${PIPESTATUS[0]}"

      - name: Stage the portable folder
        id: stage
        if: steps.appbuild.outcome == 'success'
        continue-on-error: true
        run: |
          W=$(echo "$GITHUB_WORKSPACE" | sed 's|\\|/|g')
          Q=$(echo "$QT_ROOT_DIR" | sed 's|\\|/|g')
          VC=$(echo "$VCPKG_INSTALLATION_ROOT" | sed 's|\\|/|g')/installed/x64-windows
          S="$W/stage/HopCast"; mkdir -p "$S"
          {
            echo "engine runtime:"; cp -r build/engine/rundir/RelWithDebInfo/. "$S/" && echo ok
            echo "app output:"; for d in build/app/output/*; do [ -d "$d" ] && cp -r "$d"/. "$S/" && echo "copied $d"; done
            echo "app exe:"; EXE=$(find build/app -name obs64.exe -not -path '*CMakeFiles*' | head -1); echo "$EXE"; [ -n "$EXE" ] && cp "$EXE" "$S/bin/64bit/obs64.exe"
            echo "PRISM libraries:"; find build/app -name '*.dll' -not -path '*CMakeFiles*' -not -path '*/output/*' | while read f; do cp -n "$f" "$S/bin/64bit/" && echo "$f"; done
            echo "dependency libraries:"; cp -n src/obs-studio/.deps/obs-deps-*-x64/bin/*.dll "$S/bin/64bit/" 2>&1 | tail -2; cp -n "$VC"/bin/*.dll "$S/bin/64bit/" 2>&1 | tail -2
            echo "Qt:"; "$Q/bin/windeployqt.exe" --release --no-translations --no-system-d3d-compiler --no-opengl-sw "$S/bin/64bit/obs64.exe" 2>&1 | tail -15
          } 2>&1 | tee stage.log
          find "$S" -type f | wc -l | tee -a stage.log

      - name: Check for missing libraries
        if: steps.stage.outcome == 'success'
        continue-on-error: true
        run: |
          W=$(echo "$GITHUB_WORKSPACE" | sed 's|\\|/|g')
          Q=$(echo "$QT_ROOT_DIR" | sed 's|\\|/|g')
          VC=$(echo "$VCPKG_INSTALLATION_ROOT" | sed 's|\\|/|g')/installed/x64-windows
          pip install pefile >/dev/null 2>&1
          python hopcast/scripts/win-missing-dlls.py "$W/stage/HopCast" "$Q/bin" "$VC/bin" "$W"/src/obs-studio/.deps/obs-deps-*-x64/bin "$W/build/engine" "$W/build/app" 2>&1 | tee missing.log

      - name: Start it (smoke test)
        id: smoke
        if: steps.stage.outcome == 'success'
        continue-on-error: true
        run: |
          S="$GITHUB_WORKSPACE/stage/HopCast/bin/64bit"
          ( cd "$S" && ls obs64.exe && (./obs64.exe > "$GITHUB_WORKSPACE/run.log" 2>&1 & echo $! > "$GITHUB_WORKSPACE/run.pid"); sleep 40; tasklist //FI "IMAGENAME eq obs64.exe" 2>&1 | tee -a "$GITHUB_WORKSPACE/run.log"; taskkill //F //IM obs64.exe 2>&1 | tee -a "$GITHUB_WORKSPACE/run.log" ) || true
          # whatever the app wrote about itself
          mkdir -p applogs; cp -r "$APPDATA/PRISMLiveStudio/logs" applogs/ 2>/dev/null || true; cp -r "$APPDATA/obs-studio/logs" applogs/ 2>/dev/null || true
          find applogs -type f | head -5 | tee -a run.log

      - name: Upload the portable folder
        if: steps.stage.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: HopCast-windows-portable
          path: stage/HopCast
          retention-days: 3

      - name: List what was built
        if: always()
        run: |
          { echo "dlls: $(find build/engine -name '*.dll' 2>/dev/null | wc -l)  exes: $(find build/engine -name '*.exe' 2>/dev/null | wc -l)";
            find build/engine -path '*rundir*' \( -name '*.dll' -o -name '*.exe' \) 2>/dev/null | sed 's|.*/rundir/||' | sort | head -60;
            echo "--- app output: $(find build/app/output -type f 2>/dev/null | wc -l) files";
            find build/app/output -maxdepth 4 -type d 2>/dev/null | sed 's|^build/app/output||' | head -60;
            echo "--- exes in the app build:"; find build/app -name '*.exe' -not -path '*CMakeFiles*' 2>/dev/null | head -40;
            echo "--- obs64 and PRISM dlls:"; find build/app -name 'obs64.*' -o -name 'PRISM*.dll' -o -name 'libpls*.dll' -o -name 'common-libs*.dll' 2>/dev/null | head -40; } > inventory.txt || true

      - name: Publish logs
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tmp=$(mktemp -d)
          git -C "$tmp" init -q -b dev-logs-windows
          for f in configure.log build.log vcpkg.log appconfigure.log appbuild.log stage.log missing.log run.log; do
            [ -f "$f" ] || continue
            grep -nE "CMake Error|error C[0-9]+|error LNK|fatal error|Could NOT find|FAILED|failed" "$f" | head -400 > "$tmp/${GITHUB_RUN_ID}-${f%.log}-errors.txt" || true
            tail -c 300000 "$f" > "$tmp/${GITHUB_RUN_ID}-${f%.log}-tail.log"
          done
          echo "configure=${{ steps.configure.outcome }} build=${{ steps.build.outcome }} appconfigure=${{ steps.appconfigure.outcome }} appbuild=${{ steps.appbuild.outcome }} stage=${{ steps.stage.outcome }} smoke=${{ steps.smoke.outcome }}" > "$tmp/${GITHUB_RUN_ID}-summary.txt"
          [ -f inventory.txt ] && cp inventory.txt "$tmp/${GITHUB_RUN_ID}-inventory.txt"
          for f in applogs/logs/*; do [ -f "$f" ] && tail -c 100000 "$f" > "$tmp/${GITHUB_RUN_ID}-applog-$(basename "$f")"; done 2>/dev/null || true
          git -C "$tmp" add -A
          git -C "$tmp" -c user.name=ci -c user.email=ci@localhost commit -qm "windows logs for run ${GITHUB_RUN_ID}"
          git -C "$tmp" push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:dev-logs-windows

      - name: Result
        if: steps.configure.outcome != 'success' || steps.build.outcome != 'success' || steps.appconfigure.outcome != 'success' || steps.appbuild.outcome != 'success'
        run: exit 1
