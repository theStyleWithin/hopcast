# Manual: deletes ONE pre-release (and its tag) by tag name. It refuses anything that is not marked as a pre-release, so an
# official release can't be removed with it. GPL-2.0-or-later.
name: hopcast-delete-prerelease
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the pre-release to delete (for example v0.1.20.1)"
        required: true
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          pre=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease -q .isPrerelease)
          if [ "$pre" != "true" ]; then
            echo "::error title=Refused::$TAG is not a pre-release, so it is not deleted"
            exit 1
          fi
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          echo "Deleted the pre-release $TAG and its tag."
