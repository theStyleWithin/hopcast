# Phase 1 CI: build PRISM's own layer (common-libs + PRISMLiveStudio) on Linux
# against the Phase 0 engine. Uses Qt 6.8 LTS (PRISM needs >= 6.6; Ubuntu 24.04 has 6.4).
name: hopcast-app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ui_tour:
        description: "Also run the UI tour (screenshots of every screen)"
        type: boolean
        default: false
      tour_only:
        description: "Only these UI tour scenarios (comma-separated names; empty = all)"
        type: string
        default: ""
      package:
        description: "Build the release and debug AppImages and smoke-test them"
        type: boolean
        default: false
      release_tag:
        description: "Publish the AppImages as a pre-release with this tag (e.g. v0.1.0-alpha1); empty = no release"
        type: string
        default: ""

permissions:
  contents: write   # ci-report-failure.sh pushes logs to the dev-logs branch

jobs:
  app-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch pinned engine (NAVER libobs fork)
        run: |
          git submodule update --init --depth 1 src/obs-studio
          git -C src/obs-studio submodule update --init --depth 1 plugins/obs-browser plugins/obs-websocket

      - name: Install dependencies
        run: |
          bash hopcast/scripts/deps-ubuntu.sh
          sudo apt-get install -y --no-install-recommends \
            libssl-dev libmosquitto-dev libmosquittopp-dev libzstd-dev libpng-dev \
            libgl-dev libxcb-cursor0 libxkbcommon-x11-0 libfftw3-dev

      - name: Secure store tests
        run: |
          set -o pipefail
          bash hopcast/scripts/test-securestore.sh 2>&1 | tee securestore.log

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtwebsockets qtmultimedia qtnetworkauth qtimageformats'
          cache: true

      # Restore/save split so the compiler cache is kept even when the build fails
      # (actions/cache only saves on success; during porting most runs fail).
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-app-${{ github.sha }}
          restore-keys: |
            ccache-app-
            ccache-engine-

      - name: Configure ccache
        run: |
          ccache --max-size=2G
          ccache --zero-stats

      - name: Build engine
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          set -o pipefail
          bash hopcast/scripts/build-engine.sh build/engine build/engine-install 2>&1 | tee build-engine.log

      - name: Build PRISM layer (common-libs + app)
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          set -o pipefail
          bash hopcast/scripts/build-app.sh build/engine build/app 2>&1 | tee build-app.log

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-app-${{ github.sha }}

      - name: ccache stats
        if: always()
        run: echo "::notice title=ccache::$(ccache --show-stats | grep -E 'Hits|Misses' | tr '\n' ' ')"

      - name: Count app warnings
        if: success()
        run: |
          n=$(grep -c "warning:" build-app.log || true)
          echo "::notice title=app warnings::$n compiler warnings in the PRISM layer"

      - name: Launch test (Xvfb + screenshot)
        id: launch
        continue-on-error: true
        run: |
          sudo apt-get install -y --no-install-recommends x11-apps x11-utils imagemagick gdb
          bash hopcast/scripts/launch-test-app.sh build/stage build/launch-test 30

      - name: UI tour (click through the app, screenshot every screen)
        if: inputs.ui_tour
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get install -y --no-install-recommends xdotool xcompmgr imagemagick x11-utils
          TOUR_ONLY="${{ inputs.tour_only }}" bash hopcast/scripts/ui-tour.sh build/stage build/ui-tour 2>&1 | tee build/ui-tour.log
          tmp=$(mktemp -d)
          git -C "$tmp" init -q -b dev-logs
          mkdir -p "$tmp/tour-${GITHUB_RUN_ID}"
          cp build/ui-tour/*.png build/ui-tour/*.windows.txt build/ui-tour.log "$tmp/tour-${GITHUB_RUN_ID}/" 2>/dev/null || true
          tail -c 200000 build/ui-tour/app.log > "$tmp/tour-${GITHUB_RUN_ID}/app.log" 2>/dev/null || true
          git -C "$tmp" add -A
          git -C "$tmp" -c user.name=ci -c user.email=ci@localhost commit -qm "ui tour ${GITHUB_RUN_ID}"
          git -C "$tmp" push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:dev-logs-tour

      - name: Publish launch results
        if: always() && hashFiles('build/launch-test/stdout.txt') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "::notice title=launch test::${{ steps.launch.outcome }}"
          echo "::notice title=launch stdout::$( (sed -n '/CRASH BACKTRACE/,/ALL THREADS/p' build/launch-test/stdout.txt; tail -n 30 build/launch-test/stdout.txt) | head -c 30000 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')"
          tmp=$(mktemp -d)
          git -C "$tmp" init -q -b dev-logs
          mkdir -p "$tmp/launch-${GITHUB_RUN_ID}"
          cp build/launch-test/*.txt build/launch-test/*.log build/launch-test/*.png "$tmp/launch-${GITHUB_RUN_ID}/" 2>/dev/null || true
          git -C "$tmp" add -A
          git -C "$tmp" -c user.name=ci -c user.email=ci@localhost commit -qm "launch test ${GITHUB_RUN_ID}"
          git -C "$tmp" push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dev-logs

      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('build/launch-test/stdout.txt') != ''
        with:
          name: launch-test
          path: build/launch-test/

      - name: Package AppImages (release + debug)
        id: pkg
        if: inputs.package || inputs.release_tag != ''
        run: |
          sudo apt-get install -y --no-install-recommends imagemagick libfuse2t64 xdotool x11-utils xcompmgr
          set -o pipefail
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          for v in release debug; do bash hopcast/scripts/package-appimage.sh build/stage build/appimage $v 2>&1 | tee build/package-$v.log; done

      - name: Smoke-test the AppImages
        if: steps.pkg.outcome == 'success'
        run: |
          cd build/appimage
          failed=0
          for v in release debug; do
            f=$(ls HopCast-$v-*.AppImage); chmod +x "$f"
            rm -rf "x-$v" && mkdir "x-$v" && (cd "x-$v" && APPIMAGE_EXTRACT_AND_RUN=1 ../"$f" --appimage-extract >/dev/null)
            HOPCAST_NO_GDB=1 HOPCAST_LAUNCH_BIN="$PWD/x-$v/squashfs-root/AppRun" \
              bash ../../hopcast/scripts/launch-test-app.sh "$PWD/x-$v/squashfs-root/usr" "$PWD/smoke-$v" 25 \
              || { echo "::error title=AppImage $v::did not stay running or contacted NAVER"; failed=1; }
          done
          ls smoke-debug/data/hopcast/crash-logs/session-*.log >/dev/null 2>&1 \
            || { echo "::error title=Debug AppImage::no session log written"; failed=1; }

          # The debug build must leave a crash report when the app crashes.
          rm -rf crash-test && mkdir -p crash-test/config crash-test/data
          Xvfb :98 -screen 0 1600x900x24 >/dev/null 2>&1 & xv=$!; sleep 2
          DISPLAY=:98 LIBGL_ALWAYS_SOFTWARE=1 QT_QPA_PLATFORM=xcb \
            XDG_CONFIG_HOME="$PWD/crash-test/config" XDG_DATA_HOME="$PWD/crash-test/data" \
            x-debug/squashfs-root/AppRun >/dev/null 2>&1 & app=$!
          sleep 20; kill -SEGV "$app" 2>/dev/null; wait "$app" || true; kill "$xv" 2>/dev/null
          cp crash-test/data/hopcast/crash-logs/session-*.log crash-test/ 2>/dev/null || true
          grep -q "=== HOPCAST CRASH ===" crash-test/data/hopcast/crash-logs/session-*.log \
            || { echo "::error title=Debug AppImage::crash produced no crash report"; failed=1; }

          for v in release debug; do test -s smoke-$v/screen.png || failed=1; done
          ls -la *.AppImage
          exit $failed

      - uses: actions/upload-artifact@v4
        if: steps.pkg.outcome != 'skipped'
        with:
          name: appimages
          path: |
            build/appimage/*.AppImage
            build/appimage/smoke-*/*.png
            build/appimage/smoke-*/stdout.txt
            build/appimage/crash-test/*.log
            build/package-*.log

      - name: Publish pre-release
        if: inputs.release_tag != '' && steps.pkg.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          v=$(tr -d '[:space:]' < hopcast/VERSION)
          tar --exclude=./build --exclude=./.git -czf "build/appimage/hopcast-source-$v.tar.gz" .
          sum=$(sha256sum "build/appimage/HopCast-release-$v-x86_64.AppImage" | cut -d' ' -f1)
          mkdir -p build/aur
          for f in PKGBUILD SRCINFO; do
            sed -e "s|@PKGVER@|$v|g" -e "s|@TAG@|$TAG|g" -e "s|@SHA256@|$sum|g" hopcast/packaging/aur/$f.in > build/aur/$f
          done
          mv build/aur/SRCINFO build/aur/.SRCINFO
          tar -C build/aur -czf "build/appimage/hopcast-bin-aur-$v.tar.gz" PKGBUILD .SRCINFO
          cat > notes.md <<N
          **Early test build - for testing only. Expect bugs.**

          - \`HopCast-release-*.AppImage\` - the normal build.
          - \`HopCast-debug-*.AppImage\` - writes a log and crash report to \`~/.local/share/hopcast/crash-logs/\`. Logs mask stream keys, but don't type anything sensitive into the debug build and review a log before sharing it.
          - \`hopcast-source-*.tar.gz\` - complete corresponding source (GPL-2.0).
          - \`hopcast-bin-aur-*.tar.gz\` - PKGBUILD and .SRCINFO for the AUR package \`hopcast-bin\`.

          Run: \`chmod +x HopCast-*.AppImage && ./HopCast-release-*.AppImage\`. Needs glibc 2.39+ (Ubuntu 24.04, Fedora 40, Arch/CachyOS). Not affiliated with NAVER Corp. or the OBS Project.
          N
          gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
            --title "HopCast $TAG (test build)" --notes-file notes.md \
            build/appimage/*.AppImage "build/appimage/hopcast-source-$v.tar.gz" "build/appimage/hopcast-bin-aur-$v.tar.gz"

      - name: Report failure details
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for f in securestore.log build-engine.log build-app.log; do
            if [ -f "$f" ]; then bash hopcast/scripts/ci-report-failure.sh "$f" "${f%.log}"; fi
          done
